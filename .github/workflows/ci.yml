name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check Monorepo
        run: npm run check-types

      - name: Astro Check
        run: npx --workspace=@jejak-rona/site astro check

      - name: Astro Static Production Build
        run: npx --workspace=@jejak-rona/site astro build
        env:
          PUBLIC_SITE_URL: "https://jejakrona.pages.dev"
